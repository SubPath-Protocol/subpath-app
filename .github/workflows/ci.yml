name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pnpm
        run: npm install -g pnpm@9.12.1

      - name: Setup pnpm cache
        uses: actions/cache@v6
        with:
          path: ~/.local/share/pnpm/store
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Validate FUNDING.json
        run: node scripts/validate-funding.mjs
            
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        
      - name: Generate Prisma Client
        run: pnpm --filter indexer db:generate
        
      - name: Build SDK Package
        run: pnpm --filter @subpath/sdk build
        
      - name: Typecheck Workspace
        run: pnpm run typecheck
        
      - name: Lint Workspace
        run: pnpm run lint
        
      - name: Run Workspace Tests
        run: pnpm run test
        
      - name: Build Workspace
        run: pnpm run build

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown,wasm32v1-none

      - name: Install stellar-cli
        run: |
          curl -L --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/cargo-bins/cargo-binstall/main/install-from-binstall-release.sh | bash
          cargo binstall -y stellar-cli

      - name: Run contract unit tests
        run: cargo test --workspace

      - name: Build contract
        run: stellar contract build
